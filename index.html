
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVEE Control</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#080d15;color:white;font-family:-apple-system,Arial}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.logo{font-size:27px;font-weight:900;letter-spacing:2px}
.muted{color:#8492a6;font-size:11px}
.card{background:#121c2a;border:1px solid #263449;border-radius:20px;padding:20px;margin-bottom:14px}
.center{text-align:center}
.speed{font-size:75px;font-weight:900;margin:15px 0}
.speed small{font-size:17px;color:#8492a6}
.label{font-size:11px;color:#8492a6;letter-spacing:2px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.value{font-size:24px;font-weight:800;margin-top:12px}
.green{color:#36e68b}
.blue{color:#38bdf8}
.orange{color:#ffad42}
.bar{height:9px;background:#263449;border-radius:10px;margin-top:14px;overflow:hidden}
.fill{height:100%;width:0;background:#36e68b}
button{width:100%;padding:17px;margin-top:12px;border:0;border-radius:14px;background:#1677ff;color:white;font-weight:800}
button:disabled{opacity:.4}
#debug{font-size:11px;color:#38bdf8;overflow-wrap:anywhere;line-height:1.8;white-space:pre-wrap}
</style>
</head>
<body>

<header>
<div>
<div class="logo">NAVEE.</div>
<div class="muted">CONTROL CENTER</div>
</div>
<div id="status" class="muted">● OFFLINE</div>
</header>

<div class="card center">
<div class="label">LIVE SPEED</div>
<div class="speed"><span id="speed">--</span><small> km/h</small></div>
<div class="muted" id="deviceName">NAVEE GT3</div>
</div>

<div class="card">
<div class="label">BATTERY</div>
<div class="value green"><span id="battery">--</span>%</div>
<div class="bar"><div class="fill" id="batteryFill"></div></div>
</div>

<div class="grid">
<div class="card"><div class="label">POWER</div><div class="value blue"><span id="power">--</span> W</div></div>
<div class="card"><div class="label">RANGE</div><div class="value"><span id="range">--</span> km</div></div>
<div class="card"><div class="label">TOTAL KM</div><div class="value" id="total">--</div></div>
<div class="card"><div class="label">VOLTAGE</div><div class="value orange" id="voltage">-- V</div></div>
</div>

<div class="card">
<div class="label">BLUETOOTH</div>
<button id="connect" onclick="connectScooter()">CONNECT NAVEE GT3</button>
<button onclick="disconnectScooter()">DISCONNECT</button>
<div class="muted" id="connectionInfo">Noch nicht verbunden</div>
</div>

<div class="card">
<div class="label">VEHICLE CONTROL</div>
<button disabled>🔒 LOCK – NOCH NICHT VERIFIZIERT</button>
<button disabled>🔓 UNLOCK – NOCH NICHT VERIFIZIERT</button>
<div class="muted">Steuerung bleibt deaktiviert, bis das GT3-Protokoll sicher bestätigt ist.</div>
</div>

<div class="card">
<div class="label">BLE DIAGNOSTICS</div>
<div id="debug">Bereit.</div>
</div>

<script>
"use strict";

const SERVICE_UUID =
"0000d0ff-3c17-d293-8e48-14fe2e4da212";

const RX_UUID =
"0000b003-0000-1000-8000-00805f9b34fb";

const TX_UUID =
"0000b002-0000-1000-8000-00805f9b34fb";

let device = null;
let server = null;
let rxCharacteristic = null;
let txCharacteristic = null;

const $ = id => document.getElementById(id);

function log(message) {
  $("debug").textContent += "\n" + message;
}

function setStatus(message, online = false) {
  $("status").textContent = online ? "● CONNECTED" : "● OFFLINE";
  $("status").style.color = online ? "#36e68b" : "#ff5252";
  $("connectionInfo").textContent = message;
}

async function connectScooter() {
  const button = $("connect");

  if (!navigator.bluetooth) {
    setStatus("Web Bluetooth wird nicht unterstützt.");
    return;
  }

  button.disabled = true;
  $("debug").textContent = "Starte Bluetooth-Suche...";

  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "NAVEE" }],
      optionalServices: [
        SERVICE_UUID,
        "battery_service"
      ]
    });

    device.addEventListener(
      "gattserverdisconnected",
      onDisconnected
    );

    $("deviceName").textContent = device.name || "NAVEE";
    $("connectionInfo").textContent = "Verbinde...";

    server = await device.gatt.connect();

    setStatus("Bluetooth verbunden", true);
    log("GATT-Verbindung erfolgreich.");

    await discoverServices();

  } catch (error) {
    log("FEHLER: " + error.name + ": " + error.message);
    setStatus(error.message);
  } finally {
    button.disabled = false;
  }
}

async function discoverServices() {
  log("Suche NAVEE-Dienst...");

  try {
    const service = await server.getPrimaryService(SERVICE_UUID);

    log("NAVEE SERVICE: " + service.uuid);

    const characteristics =
      await service.getCharacteristics();

    for (const characteristic of characteristics) {
      const uuid = characteristic.uuid;

      log(
        "CHAR: " + uuid +
        " | READ: " + characteristic.properties.read +
        " | NOTIFY: " + characteristic.properties.notify +
        " | WRITE: " + characteristic.properties.write
      );

      if (uuid === RX_UUID) {
        rxCharacteristic = characteristic;

        if (characteristic.properties.notify) {
          await characteristic.startNotifications();

          characteristic.addEventListener(
            "characteristicvaluechanged",
            handleNotification
          );

          log("Empfang B003 aktiviert.");
        }
      }

      if (uuid === TX_UUID) {
        txCharacteristic = characteristic;
        log("Sende-Characteristic B002 erkannt.");
      }

      if (characteristic.properties.read) {
        try {
          const data = await characteristic.readValue();
          log("READ " + uuid + ": " + toHex(data));
        } catch (error) {
          log("READ FEHLER: " + error.message);
        }
      }
    }

    if (!rxCharacteristic) {
      log("B003 nicht gefunden.");
    }

    if (!txCharacteristic) {
      log("B002 nicht gefunden.");
    }

    await readBatteryService();

  } catch (error) {
    log("GATT-DIAGNOSE: " + error.message);
  }
}

async function readBatteryService() {
  try {
    const service =
      await server.getPrimaryService("battery_service");

    const characteristic =
      await service.getCharacteristic("battery_level");

    const data = await characteristic.readValue();
    const level = data.getUint8(0);

    $("battery").textContent = level;
    $("batteryFill").style.width = level + "%";

    log("Standard-Batteriedienst: " + level + "%");

  } catch (error) {
    log("Kein lesbarer Standard-Batteriedienst.");
  }
}

function handleNotification(event) {
  const data = event.target.value;

  log("NAVEE RX: " + toHex(data));

  // Rohdaten werden protokolliert.
  // Erst nach bestätigter Protokollauswertung
  // werden daraus Geschwindigkeit, Akku und Watt.
}

function toHex(data) {
  return Array.from(
    new Uint8Array(
      data.buffer,
      data.byteOffset,
      data.byteLength
    )
  ).map(byte =>
    byte.toString(16).padStart(2, "0")
  ).join(" ");
}

function onDisconnected() {
  server = null;
  rxCharacteristic = null;
  txCharacteristic = null;

  setStatus("Bluetooth getrennt");
  $("deviceName").textContent = "NAVEE GT3";
  log("Verbindung getrennt.");
}

function disconnectScooter() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }
}
</script>

</body>
</html>
